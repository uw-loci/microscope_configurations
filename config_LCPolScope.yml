# LC-PolScope: one config for both camera ports, the Hamamatsu Flash4 and the FLIR Oryx.
# Each camera runs its own Micro-Manager config (_MM2/config_LCPolScope_Hamamatsu.cfg,
# _MM2/config_LCPolScope.cfg); QPSC and the server read which camera Micro-Manager has
# active and use that camera's values.
#
# per_detector: camera-specific values, keyed by detector ID, beside the values they
# change. The active camera's entry is merged into the mapping that holds it: a scalar
# is replaced, a mapping is merged key by key, and device_properties entries replace
# the entry with the same device and property. The values beside it are the shared
# defaults (here the Hamamatsu's, the camera in use); a camera with no entry uses them.
# Background and history of these settings: claude-reports/design/2026-11-12_lcpolscope-config-notes.md (QPSC monorepo).

microscope:
  name: LCPolScope
  type: Multimodal
  detector_in_use: null
  objective_in_use: null
  modality: null

# optical_flip and stage_view_flip change the Stage Map display only.
light_path:
  scope_type: inverted
  slide_insertion: A  # A | B
  optical_flip: none  # none | x | y | xy
  stage_view_flip: none  # none | x | y | xy

modalities:
  lcpolscope:
    type: polarized

    # Not derivable from Micro-Manager: keep current with the LC calibration.
    reconstruction:
      wavelength_nm: 549  # Semrock FF01-549/15; retardance in nm scales with it
      swing_waves: 0.05  # swing (chi), waves
      condenser_na: 0.5
      objective_medium_ri: 1.3  # TODO(bench): confirm
      # Used by the LC calibration only; the server refuses MM-Voltage.
      lc_control_mode: MM-Retardance
      scheme: 5-State  # must match the calibration's scheme

      # Order the states are fed to the reconstruction (extinction, +S1, +S2, -S1, -S2).
      # Apply to acquisition resets it; a wrong order rotates orientation without any error.
      state_order: [State0, State1, State2, State3, State4]

      # openpolscope (matches OpenPolScope 3.20b) | qlipp
      method: openpolscope

      # Camera counts subtracted from every state, in the acquisition pixel format; the LC calibration measures it and Apply offers it.
      black_level: 51
      # display_* settings change the imported images' look only, never the numbers.
      display_retardance_ceiling_nm: 20
      display_colormap: ppm
      display_hue_calibration:
        source: Negative_7_Oct2026.npz
        slope: -0.005541962395299577
        intercept: 0.9860845130836212
        hue_offset: 0.28
      display_orientation_sign: -1
      display_orientation_offset_deg: 4.5
      # Per-tile removal of a smooth residual background; off by default.
      estimated_background:
        enabled: false
        order: 2
        block_size: 32
        max_block_retardance_nm: 5
        min_background_fraction: 0.25
      lc_calibrated_at: '2026-11-12T14:34:58'
      lc_extinction_ratio: 271.4
      lc_calibration_file: 'C:\qpsc-extension\data\LiverTests\JOVE_PPM\calibrations\lcpolscope\lc_calibration_20261112_143458.json'
      # Black level and LC calibration are measured per camera.
      per_detector:
        LCPS_DETECTOR_HAMAMATSU_FLASH_001:
          black_level: 51
          lc_calibrated_at: '2026-11-12T14:34:58'
          lc_extinction_ratio: 271.4
          lc_calibration_file: 'C:\qpsc-extension\data\LiverTests\JOVE_PPM\calibrations\lcpolscope\lc_calibration_20261112_143458.json'
        LCPS_DETECTOR_FLIR_ORYX_001:
          black_level: 99
          lc_calibrated_at: '2026-10-26T18:01:14'
          lc_extinction_ratio: 275.0
          lc_calibration_file: 'C:\qpsc-extension\data\LiverTests\JOVE_PPM\calibrations\lcpolscope\lc_calibration_20261026_180114.json'

    # Exposure must be the same for all five states (the Stokes math assumes one scale).
    # Apply to acquisition (LC calibration) rewrites each state's retardances, per camera.
    channels:
    - id: State0
      display_name: State0 (extinction)
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.256
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.5085
      # TODO(bench): measure the LC settle time; 50 ms is a guess.
      settle_ms: 50
      per_detector:
        LCPS_DETECTOR_HAMAMATSU_FLASH_001:
          exposure_ms: 141.5
          device_properties:
          - device: MeadowlarkLC
            property: Retardance LC-A [in waves]
            value: 0.256
          - device: MeadowlarkLC
            property: Retardance LC-B [in waves]
            value: 0.5085
        LCPS_DETECTOR_FLIR_ORYX_001:
          exposure_ms: 30
          device_properties:
          - device: MeadowlarkLC
            property: Retardance LC-A [in waves]
            value: 0.2504
          - device: MeadowlarkLC
            property: Retardance LC-B [in waves]
            value: 0.438
    - id: State1
      display_name: State1
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.206
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.5085
      settle_ms: 50
      per_detector:
        LCPS_DETECTOR_HAMAMATSU_FLASH_001:
          exposure_ms: 141.5
          device_properties:
          - device: MeadowlarkLC
            property: Retardance LC-A [in waves]
            value: 0.206
          - device: MeadowlarkLC
            property: Retardance LC-B [in waves]
            value: 0.5085
        LCPS_DETECTOR_FLIR_ORYX_001:
          exposure_ms: 30
          device_properties:
          - device: MeadowlarkLC
            property: Retardance LC-A [in waves]
            value: 0.2204
          - device: MeadowlarkLC
            property: Retardance LC-B [in waves]
            value: 0.438
    - id: State2
      display_name: State2
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.256
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.5578
      settle_ms: 50
      per_detector:
        LCPS_DETECTOR_HAMAMATSU_FLASH_001:
          exposure_ms: 141.5
          device_properties:
          - device: MeadowlarkLC
            property: Retardance LC-A [in waves]
            value: 0.256
          - device: MeadowlarkLC
            property: Retardance LC-B [in waves]
            value: 0.5578
        LCPS_DETECTOR_FLIR_ORYX_001:
          exposure_ms: 30
          device_properties:
          - device: MeadowlarkLC
            property: Retardance LC-A [in waves]
            value: 0.2504
          - device: MeadowlarkLC
            property: Retardance LC-B [in waves]
            value: 0.4522
    - id: State3
      display_name: State3
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.3106
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.5085
      settle_ms: 50
      per_detector:
        LCPS_DETECTOR_HAMAMATSU_FLASH_001:
          exposure_ms: 141.5
          device_properties:
          - device: MeadowlarkLC
            property: Retardance LC-A [in waves]
            value: 0.3106
          - device: MeadowlarkLC
            property: Retardance LC-B [in waves]
            value: 0.5085
        LCPS_DETECTOR_FLIR_ORYX_001:
          exposure_ms: 30
