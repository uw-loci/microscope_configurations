# Companion to config_LCPolScope_Hamamatsu.yml: the LC-PolScope seen through
# the Hamamatsu ORCA-Flash4.0 V2. Same layout as imageprocessing_LCPolScope.yml.
# Background collection writes this camera's backgrounds under its own detector
# folder, so the two cameras never share one.
# ============================================================================
# Image processing settings for the LC-PolScope (Hamamatsu ORCA-Flash4.0 V2, mono).
# Read by QPSC from the folder holding config_LCPolScope.yml; the file name
# must stay imageprocessing_LCPolScope.yml.
#
# QPSC's configuration validation requires at least one
# modality/objective/detector combination with an exposures_ms map. Without
# this file it reports "No valid exposure settings found in imageprocessing
# config". Only 20x is calibrated on this scope, so only 20x is declared.
# ============================================================================

background_correction:
  # lcpolscope: the background is the five states on a specimen-free,
  # defocused field, applied per tile INSIDE the reconstruction (the server
  # never divides raw LC-PolScope states, whatever `method` says). QPSC's
  # Background Collection sets enabled and base_folder here when it runs.
  # Collect after calibrating; the acquisition refuses a background taken
  # under a different LC calibration (background_provenance.json).
  # brightfield: turn on only after a background has been collected.
  lcpolscope:
    enabled: false
    method: none
    base_folder: null
  brightfield:
    enabled: false
    method: none
    base_folder: null

imaging_profiles:
  lcpolscope:
    LCPS_OBJECTIVE_20X_POL_001:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001:
        white_balance:
          enabled: false            # monochrome camera
        exposures_ms:
          # ONE value for all five LC states. Per-state exposure differences
          # bias retardance and orientation. 33 ms is OpenPolScope's working
          # exposure on this camera (2026-10-16).
          single: 33
        gains:
          single: 1.0
    LCPS_OBJECTIVE_10X_001:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001:
        white_balance:
          enabled: false
        exposures_ms:
          single: 33                # TODO(bench): set from the brightest state at 10x
        gains:
          single: 1.0
    LCPS_OBJECTIVE_4X_001:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001:
        white_balance:
          enabled: false
        exposures_ms:
          single: 33                # TODO(bench): set from the brightest state at 4x
        gains:
          single: 1.0
  brightfield:
    LCPS_OBJECTIVE_20X_POL_001:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001:
        white_balance:
          enabled: false
        exposures_ms:
          single: 20                # TODO(bench): placeholder, matches config_LCPolScope.yml
        gains:
          single: 1.0
    LCPS_OBJECTIVE_10X_001:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001:
        white_balance:
          enabled: false
        exposures_ms:
          single: 20                # TODO(bench)
        gains:
          single: 1.0
    LCPS_OBJECTIVE_4X_001:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001:
        white_balance:
          enabled: false
        exposures_ms:
          single: 20                # TODO(bench)
        gains:
          single: 1.0
