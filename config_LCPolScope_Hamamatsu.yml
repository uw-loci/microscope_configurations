# LC-PolScope, Hamamatsu camera port. Same stand as config_LCPolScope.yml (Oryx):
# keep stage, LC and objective settings identical in both (the config CI checks it).
# Background and history of these settings: claude-reports/design/2026-11-12_lcpolscope-config-notes.md (QPSC monorepo).

microscope:
  name: LCPolScope_Hamamatsu
  type: Multimodal
  detector_in_use: null
  objective_in_use: null
  modality: null

# optical_flip and stage_view_flip change the Stage Map display only.
light_path:
  scope_type: inverted
  slide_insertion: A  # A | B
  optical_flip: none  # none | x | y | xy
  stage_view_flip: none  # none | x | y | xy

modalities:
  lcpolscope:
    type: polarized

    # Not derivable from Micro-Manager: keep current with the LC calibration.
    reconstruction:
      wavelength_nm: 549  # Semrock FF01-549/15; retardance in nm scales with it
      swing_waves: 0.05  # swing (chi), waves
      condenser_na: 0.5
      objective_medium_ri: 1.3  # TODO(bench): confirm
      # Used by the LC calibration only; the server refuses MM-Voltage.
      lc_control_mode: MM-Retardance
      scheme: 5-State  # must match the calibration's scheme

      # Order the states are fed to the reconstruction (extinction, +S1, +S2, -S1, -S2).
      # Apply to acquisition resets it; a wrong order rotates orientation without any error.
      state_order: [State0, State1, State2, State3, State4]

      # openpolscope (matches OpenPolScope 3.20b) | qlipp
      method: openpolscope
      # Camera counts subtracted from every state, in the acquisition pixel format; the LC calibration measures it and Apply offers it.
      black_level: 51
      # display_* settings change the imported images' look only, never the numbers.
      display_retardance_ceiling_nm: 20
      display_colormap: ppm
      display_hue_calibration:
        source: Negative_7_Oct2026.npz
        slope: -0.005541962395299577
        intercept: 0.9860845130836212
        hue_offset: 0.28
      display_orientation_sign: -1
      display_orientation_offset_deg: 4.5
      # Per-tile removal of a smooth residual background; off by default.
      estimated_background:
        enabled: false
        order: 2
        block_size: 32
        max_block_retardance_nm: 5
        min_background_fraction: 0.25
      lc_calibrated_at: '2026-11-12T14:34:58'
      lc_extinction_ratio: 271.4
      lc_calibration_file: 'C:\qpsc-extension\data\LiverTests\JOVE_PPM\calibrations\lcpolscope\lc_calibration_20261112_143458.json'

    # Exposure must be the same for all five states (the Stokes math assumes one scale).
    # Apply to acquisition (LC calibration) rewrites each state's device_properties.
    channels:
    - id: State0
      display_name: State0 (extinction)
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.256
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.5085
      # TODO(bench): measure the LC settle time; 50 ms is a guess.
      settle_ms: 50
    - id: State1
      display_name: State1
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.206
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.5085
      settle_ms: 50
    - id: State2
      display_name: State2
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.256
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.5578
      settle_ms: 50
    - id: State3
      display_name: State3
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.3106
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.5085
      settle_ms: 50
    - id: State4
      display_name: State4
      exposure_ms: 141.5
      device_properties:
      - device: MeadowlarkLC
        property: Wavelength
        value: 549.0
      - device: MeadowlarkLC
        property: Retardance LC-A [in waves]
        value: 0.256
      - device: MeadowlarkLC
        property: Retardance LC-B [in waves]
        value: 0.4616
      settle_ms: 50

  brightfield:
    type: brightfield

hardware:
  # Nosepiece turned by hand; mm_preset only selects Micro-Manager's pixel-size preset.
  objectives:
  - id: LCPS_OBJECTIVE_20X_POL_001
    mm_preset: {group: Objective, preset: 20x, motorized: false}
    pixel_size_xy_um:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001: 0.2695  # measured 2026-10-21
    pixel_size_z_um: null
  - id: LCPS_OBJECTIVE_4X_001
    mm_preset: {group: Objective, preset: 4x, motorized: false}
    pixel_size_xy_um:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001: 1.3452  # ESTIMATE
    pixel_size_z_um: null
  - id: LCPS_OBJECTIVE_10X_001
    mm_preset: {group: Objective, preset: 10x, motorized: false}
    pixel_size_xy_um:
      LCPS_DETECTOR_HAMAMATSU_FLASH_001: 0.5452  # ESTIMATE
    pixel_size_z_um: null
  detectors:
  - LCPS_DETECTOR_HAMAMATSU_FLASH_001

stage:
  stage_id: LCPS_STAGE_ASI_001
  polarity: INVERT_Y
  z_stage: ZStage
  # Micro-Manager coordinates. QPSC refuses moves outside them.
  limits:
    x_um:
      low: -37200
      high: 37800
    y_um:
      low: -9000
      high: 17000
    z_um:
      low: -200
      high: 500
  # Off: ASI speed behavior unmeasured. Set by Re-probe Stage AF, not by hand.
  streaming_af:
    enabled: false
    speed_property: null  # TODO(bench): probe for a writable speed property
    slow_speed_value: '1'
    slow_speed_um_per_s: 11.5
    normal_speed_value: '100'

slide_size_um:
  x: 75000
  y: 25000

# Key: <modality>_<objective substring>. No channel_overrides on lcpolscope profiles.
acquisition_profiles:
  lcpolscope_20x:
    modality: lcpolscope
    detector: LCPS_DETECTOR_HAMAMATSU_FLASH_001
    objective: LCPS_OBJECTIVE_20X_POL_001
    channels: [State0, State1, State2, State3, State4]

  brightfield_20x:
    modality: brightfield
    detector: LCPS_DETECTOR_HAMAMATSU_FLASH_001
    objective: LCPS_OBJECTIVE_20X_POL_001
    exposure_ms: 20  # TODO(bench)

  lcpolscope_10x:
    modality: lcpolscope
    detector: LCPS_DETECTOR_HAMAMATSU_FLASH_001
    objective: LCPS_OBJECTIVE_10X_001
    channels: [State0, State1, State2, State3, State4]

  lcpolscope_4x:
    modality: lcpolscope
    detector: LCPS_DETECTOR_HAMAMATSU_FLASH_001
    objective: LCPS_OBJECTIVE_4X_001
    channels: [State0, State1, State2, State3, State4]

  brightfield_10x:
    modality: brightfield
    detector: LCPS_DETECTOR_HAMAMATSU_FLASH_001
    objective: LCPS_OBJECTIVE_10X_001
    exposure_ms: 20  # TODO(bench)

  brightfield_4x:
    modality: brightfield
    detector: LCPS_DETECTOR_HAMAMATSU_FLASH_001
    objective: LCPS_OBJECTIVE_4X_001
    exposure_ms: 20  # TODO(bench)
