# ========== AUTOFOCUS CONFIGURATION ==========
# Per-objective autofocus parameters and per-modality strategy bindings.
# Vocabulary (metric / strategy / validity-check names) is sourced from
# focus_metrics_manifest.yml; this header is regenerated on every save.
#
# OBJECTIVE FIELDS:
#   n_steps              -- Z positions sampled for the standard sweep
#   search_range_um      -- total Z range searched in micrometres
#   interp_strength      -- interpolation density factor (typical 50-200)
#   interp_kind          -- 'linear', 'quadratic', or 'cubic'
#   sweep_range_um       -- in-acquisition drift-check Z range (default 10)
#   sweep_n_steps        -- in-acquisition drift-check Z samples (default 6)
#   n_tiles              -- run AF every N tiles; sets af_min_distance
#   score_metric         -- focus metric (see AVAILABLE SCORE METRICS below)
#   gap_index_multiplier -- force AF after (this x n_tiles) positions w/o one
#   gap_spatial_multiplier -- force AF beyond (this x af_min_distance)
#
# AVAILABLE SCORE METRICS:
#   [recommended]
#     tenengrad
#       best for : Brightfield, PPM at typical magnifications. Streaming-AF default for tissue. Sum of squared Sobel gradients -- inherently high-pass, immune to lamp vignette.
#       avoid    : Very dark or sparse fluorescence with sub-resolution objects -- gradient signal is weak relative to noise. Use laplacian_variance for sparse particle samples (pollen grains, beads, FISH spots) where bright-spot detection is more reliable than edge gradients.
#     laplacian_variance
#       best for : Lower magnifications (10x and below) on brightfield. Sparse particles on dark background (pollen grains, beads, FISH spots, scattered fluorescent objects) -- the second derivative is highly responsive to bright point-like features. The internal sparse_signal strategy uses this metric paired with a bright-spot validity check. Variance of the Laplacian-filtered image; high-pass.
#       avoid    : High magnification brightfield -- sensitivity falls off as features become large compared to the kernel. Continuous tissue at high mag -- the Laplacian over-emphasises pixel-scale noise relative to feature edges.
#     brenner_gradient
#       best for : Fast checks, low-contrast and dark-field samples. Sum of squared lag-2 horizontal differences. Robust to noise and dark backgrounds; reasonable second-choice for sparse fluorescence if laplacian_variance over-responds to single-pixel noise.
#       avoid    : Samples needing fine peak resolution -- robust but coarse.
#   [advanced]
#     normalized_variance  [brightfield/ppm only, 20x+]
#       best for : High-magnification brightfield with dim or non-uniform illumination where var/mean stays focus-sensitive. Brightfield ONLY -- the var/mean ratio is meaningful only when the mean reflects sample- scale illumination, not background dark current.
#       avoid    : Low magnifications on brightfield -- known to fail because the lamp vignette dominates var/mean. Confirmed on OWS3 BF 10x 2026-05-01. Fluorescence at any magnification -- background dark current makes both var and mean small and noisy, so the ratio is unstable.
#     vollath_f5
#       best for : Samples with periodic or striated structure. Autocorrelation at lag 1 minus N*mean^2.
#       avoid    : Cell smears, amorphous tissue.
#     sobel
#       best for : High-contrast features, edge-rich tissue.
#       avoid    : Smooth gradients without edges.
#     robust_sharpness_metric
#       best for : Modality-aware multi-metric strategies (used by dense_texture). Median filter + Otsu mask + sharpness on the masked region.
#       avoid    : Non-strategy / ad-hoc paths.
#     hybrid_sharpness_metric  [brightfield/ppm only]
#       best for : Modality-aware combination of Brenner + soft tissue mask + Gaussian smoothing. Brightfield / PPM ONLY: the soft mask weights mid-gray pixels highest, which matches BF tissue (dark features against a bright background) but actively suppresses fluorescence signal (bright features against a dark background) -- under FL the brighter and sharper the field, the LOWER this metric scores.
#       avoid    : Fluorescence at any magnification -- the mid-gray soft mask inverts the metric (sharper FL -> smaller score). Use vollath_f5 or laplacian_variance for FL instead. Non-strategy / ad-hoc paths -- this metric is wired into the dense_texture strategy and not directly usable by streaming or standard AF.
#   [special]
#     p98_p2  (fallback)
#       best for : Histogram-spread fallback. Always computed alongside the primary metric in the standard AF path and used when peak validation fails on the primary -- no extra acquisition cost. Modality- agnostic AS A PEAK FINDER: standard AF compares p98_p2 across Z and picks the maximum-difference Z, which works for both BF (focus pulls p2 down -> larger spread) and FL (focus pulls p98 up -> larger spread). The intermediate Z extreme of the curve is what matters; "higher = sharper" comparisons across modalities are NOT meaningful.
#       avoid    : Picking it as a primary unless you specifically want histogram- spread behavior. Any code path that compares p98_p2 values across different modalities or different fields-of-view -- the metric's sign and magnitude meaning changes with the sample's brightness direction (BF: dark features on bright bg; FL: bright features on dark bg).
#     none
#       best for : Used by the manual_only strategy (no scoring needed).
#       avoid    : Anywhere else.
#
# STRATEGIES (referenced by per-modality bindings):
#   dense_texture -> score_metric_default=laplacian_variance, validity_check=texture_and_area, on_failure=defer
#   sparse_signal -> score_metric_default=laplacian_variance, validity_check=bright_spot_count, on_failure=proceed
#   dense_fluorescence -> score_metric_default=vollath_f5, validity_check=total_gradient_energy, on_failure=proceed
#   dark_field -> score_metric_default=brenner_gradient, validity_check=total_gradient_energy, on_failure=proceed
#   manual_only -> score_metric_default=none, validity_check=always_false, on_failure=manual
#
# MODALITY DEFAULTS (used when no per-objective score_metric is set):
#   1p -> vollath_f5
#   2p -> vollath_f5
#   bf -> tenengrad
#   brightfield -> tenengrad
#   fluorescence -> vollath_f5
#   fluorescent -> vollath_f5
#   laser_scanning -> vollath_f5
#   lsm -> vollath_f5
#   multiphoton -> vollath_f5
#   polarized -> tenengrad
#   ppm -> tenengrad
#   shg -> vollath_f5
#   wf -> vollath_f5
#   widefield -> vollath_f5
#
# RENAMED METRICS (loader rejects the old name):
#   volath5 -> vollath_f5
#   tenenbaum_gradient -> tenengrad

schema_version: 2
autofocus_settings:
- objective: LOCI_OBJECTIVE_OLYMPUS_10X_001
  calibrated: true
  n_steps: 35
  search_range_um: 50.0
  n_tiles: 4
  interp_strength: 100
  interp_kind: quadratic
  score_metric: brenner_gradient
  texture_threshold: 0.005
  tissue_area_threshold: 0.2
  sweep_range_um: 50.0
  sweep_n_steps: 3
  edge_retries: 2
  gap_index_multiplier: 3
  gap_spatial_multiplier: 2.0
  p98_p2_fallback_enabled: true
- objective: LOCI_OBJECTIVE_OLYMPUS_20X_POL_001
  calibrated: true
  n_steps: 100
  search_range_um: 100.0
  n_tiles: 1
  interp_strength: 100
  interp_kind: quadratic
  # 2026-08-28. Settled after two reversals; the deciding evidence is below, because
  # the two metrics fail in OPPOSITE and easily-confused ways.
  #
  # Focus-approach validation over real tissue, brenner_gradient:
  #   focus peak Z=-212.7, FWHM 5.9 um, and the NO-TISSUE scan flat at 1% of the
  #   tissue scan's amplitude. A narrow peak in the right place, and nothing where
  #   there is nothing.
  #
  # The case that briefly argued for p98_p2 was autofocus at a tile that turned out to
  # be over near-blank field (camera mean RGB 207/201/198). There brenner read flat --
  # 0.7-1.2%, correctly, because there was no structure to measure -- while p98_p2 fit
  # at R^2=0.97-0.99 with a plausible-looking mu. That is not p98_p2 doing better. It
  # is p98_p2 being unfalsifiable: it measures histogram spread, which keeps varying
  # with defocus on an empty field, so it returns a confident peak for tissue that is
  # not there. That false positive is how the approach committed Z=-119 and Z=-9.7.
  #
  # A metric that reports 'flat' on an empty field is telling the truth, and the fix
  # for a flat reading is a better tile, not a metric that invents a peak.
  # p98_p2 remains the FALLBACK below, which is its documented role.
  score_metric: brenner_gradient
  texture_threshold: 0.005
  tissue_area_threshold: 0.2
  sweep_range_um: 30.0
  sweep_n_steps: 30
  edge_retries: 2
  gap_index_multiplier: 3
  gap_spatial_multiplier: 0.5
  p98_p2_fallback_enabled: true
- objective: LOCI_OBJECTIVE_OLYMPUS_40X_POL_001
  calibrated: true
  n_steps: 20
  search_range_um: 20.0
  n_tiles: 7
  interp_strength: 100
  interp_kind: quadratic
  score_metric: tenengrad
  texture_threshold: 0.005
  tissue_area_threshold: 0.2
  sweep_range_um: 20.0
  sweep_n_steps: 20
  edge_retries: 2
  gap_index_multiplier: 3
  gap_spatial_multiplier: 2.0
  p98_p2_fallback_enabled: true
strategies:
  dense_texture:
    description: H&E, IHC, PPM, confluent IF. Requires both sufficient gradient texture
      AND a significant tissue-area fraction.
    score_metric: laplacian_variance
    validity_check: texture_and_area
    validity_params:
      texture_threshold: 0.01
      tissue_area_threshold: 0.2
      rgb_brightness_threshold: 240.0
      tissue_mask_range:
      - 0.1
      - 0.9
      median_floor: 15.0
      saturation_threshold: 0.1
    on_failure: defer
  stained_colour:
    # Same score metric and on_failure as dense_texture -- only the tissue TEST differs.
    #
    # WHY NOT texture_and_area here. It normalises per frame, and that makes its verdict a
    # property of the frame's histogram rather than of what is in the frame. Measured both
    # ways on 2026-08-28: bare glass PASSES it (its own sensor noise stretches to full range
    # and reads as texture ~0.06 against this scope's 0.005 threshold, with area 1.000), and
    # a two-level tile straddling a tissue edge FAILS it (nothing lands inside the mask
    # range, so the area term reads 0.000). Both directions are wrong, and no threshold
    # fixes either, so the approach's tissue gate could not do the one job it exists for --
    # rejecting a coverslip -- which is how a focus landed 200 um off the sample and logged
    # a success.
    #
    # Colour does not have that failure. It is absolute, not per-frame, and it is
    # defocus-invariant: measured on this scope, blank glass holds a median chroma of 11-13
    # while stained tissue holds 36, flat across a 256 um traverse over which the focus
    # metric swings 2.4x. Glass cannot produce chroma, so it cannot pass.
    #
    # REQUIRES A COLOUR DETECTOR. Both PPM detectors are colour (the JAI is a 3-CCD prism,
    # the Teledyne debayers). Do NOT copy this binding to a mono scope -- OWS3's Hamamatsu
    # and LC-PolScope's Oryx are monochrome, and chroma_deviation rejects every frame there.
    description: H&E, IHC, PPM on a COLOUR detector. Decides tissue by stain colour, which
      survives defocus, instead of by spatial structure, which does not.
    score_metric: laplacian_variance
    validity_check: chroma_deviation
    validity_params:
      # Sits between the measured blank (11-13) and tissue (36). Re-measure with a Focus
      # Approach Validation pair if the stain or illumination changes -- samples.csv carries
      # chroma_median / chroma_p95 / chroma_frac for exactly that.
      min_chroma: 28.0
      # 15% of the field must be stained, so a tile at the edge of a section still passes.
      chroma_area_threshold: 0.15
      saturation_ceiling: 250.0
    on_failure: defer
  manual_only:
    description: Skip auto entirely. Always prompts the user.
    score_metric: none
    validity_check: always_false
    validity_params: {
      }
    on_failure: manual
modalities:
  ppm:
    strategy: stained_colour
  brightfield:
    strategy: stained_colour
  bf:
    strategy: stained_colour
