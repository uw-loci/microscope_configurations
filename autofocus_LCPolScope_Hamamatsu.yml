# ========== AUTOFOCUS CONFIGURATION -- LC-PolScope ==========
# Companion to config_LCPolScope_Hamamatsu.yml (copied from autofocus_LCPolScope.yml;
# autofocus parameters are per objective, not per camera). Schema v2: per-objective HARDWARE
# parameters, a strategy library (sample physics), and per-modality bindings.
# The metric / strategy / validity-check vocabulary comes from
# focus_metrics_manifest.yml.
#
# Only the 20x row is calibrated (on the Oryx port, 2026-10-19; copied here
# 2026-10-21). The other rows are calibrated: false and carry
# starting values borrowed from the PPM scope, which is the closest analogue
# we have (transmitted polarized light, tissue-like dense samples). Search
# ranges depend on the objective depth of field and the ASI Z drive's backlash,
# neither of which is known yet. Run the AF calibration workflow per objective
# before relying on any of this.
#
# LC-POLSCOPE-SPECIFIC HAZARD: autofocus must NOT run on the extinction state.
# State0 is near-black by construction, so every gradient- and texture-based
# metric collapses into noise there and the validity check will either defer
# forever or lock onto a noise peak. Focus on a bright state instead. Until
# the modality handler exposes a focus-channel choice (Phase 1 of the plan
# doc), this is an operator-visible constraint, not something this file can
# enforce -- Channel.getFocusChannelId() is the hook that will enforce it.

schema_version: 2

autofocus_settings:
- objective: LCPS_OBJECTIVE_20X_POL_001
  calibrated: true
  # Copied 2026-10-21 from autofocus_LCPolScope.yml, calibrated on the Oryx
  # port 2026-10-19. Autofocus depends on the objective, not the camera, but
  # this port may not be parfocal with the Oryx: if focus here sits more than
  # ~15 um from where the Oryx focuses, widen search_range_um for the first run.
  n_steps: 30
  search_range_um: 30.0
  n_tiles: 3
  interp_strength: 100
  interp_kind: quadratic
  # brenner_gradient, not tenengrad: tenengrad read flat on PPM 20x because a
  # bright background swamped the gradient, and brenner stayed robust to dust.
  # channel_reduction is omitted on purpose: the camera is monochrome, so there
  # are no colour planes to choose between.
  score_metric: brenner_gradient
  texture_threshold: 0.005
  tissue_area_threshold: 0.2
  sweep_range_um: 30.0
  sweep_n_steps: 30
  edge_retries: 2
  gap_index_multiplier: 3
  gap_spatial_multiplier: 1.0
  p98_p2_fallback_enabled: true
- objective: LCPS_OBJECTIVE_10X_001
  calibrated: false
  # Uncalibrated starting values. NA 0.5 gives a depth of field close to the
  # 20x's (NA 0.4), so the same sweep is a reasonable start.
  n_steps: 100
  search_range_um: 100.0
  n_tiles: 1
  interp_strength: 100
  interp_kind: quadratic
  score_metric: brenner_gradient
  texture_threshold: 0.005
  tissue_area_threshold: 0.2
  sweep_range_um: 30.0
  sweep_n_steps: 30
  edge_retries: 2
  gap_index_multiplier: 3
  gap_spatial_multiplier: 0.5
  p98_p2_fallback_enabled: true
- objective: LCPS_OBJECTIVE_4X_001
  calibrated: false
  # Uncalibrated starting values. NA 0.13: depth of field ~30 um, ten times
  # the 20x's, so a wider, coarser sweep.
  n_steps: 60
  search_range_um: 300.0
  n_tiles: 1
  interp_strength: 100
  interp_kind: quadratic
  score_metric: brenner_gradient
  texture_threshold: 0.005
  tissue_area_threshold: 0.2
  sweep_range_um: 120.0
  sweep_n_steps: 30
  edge_retries: 2
  gap_index_multiplier: 3
  gap_spatial_multiplier: 0.5
  p98_p2_fallback_enabled: true
strategies:
  dense_texture:
    description: H&E, IHC, PPM, LC-PolScope, confluent IF. Requires both sufficient
      gradient texture AND a significant tissue-area fraction.
    score_metric: laplacian_variance
    validity_check: texture_and_area
    validity_params:
      texture_threshold: 0.01
      tissue_area_threshold: 0.2
      rgb_brightness_threshold: 240.0
      tissue_mask_range:
      - 0.1
      - 0.9
      median_floor: 15.0
      saturation_threshold: 0.1
    on_failure: defer
  manual_only:
    description: Skip auto entirely. Always prompts the user.
    score_metric: none
    validity_check: always_false
    validity_params: {}
    on_failure: manual

modalities:
  # Bindings are matched longest-prefix-wins, case-insensitive, against the
  # modality name from config_LCPolScope_Hamamatsu.yml.
  lcpolscope:
    strategy: dense_texture
    overrides:
      validity_params:
        # Polarized transmitted light spreads intensity over a wider range
        # than brightfield and birefringent structures sit outside the
        # ordinary tissue band -- same widening PPM needed.
        tissue_mask_range:
        - 0.05
        - 0.95
        texture_threshold: 0.005
        # A polarization image is mostly dark background even on a bright
        # state, so the standard 20% tissue-area floor rejects valid fields.
        tissue_area_threshold: 0.1
  brightfield:
    strategy: dense_texture
  bf:
    strategy: dense_texture
