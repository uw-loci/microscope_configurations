microscope:
  name: PPM
  type: UprightBrightfield
  detector_in_use: null
  objective_in_use: null
  modality: null
test-push:
  MSN: PPM_001
modalities:
  ppm:
    type: polarized
    optics: 1
    pizstage_offset: 177082.5
    rotation_stage:
      device: LOCI_STAGE_PI_001
      type: polarizer
    rotation_angles:
    - name: negative
      tick: -7
    - name: crossed
      tick: 0
    - name: positive
      tick: 7
    - name: uncrossed
      tick: 90
  brightfield:
    type: brightfield
hardware:
  objectives:
  - id: LOCI_OBJECTIVE_OLYMPUS_10X_001
    pixel_size_xy_um:
      LOCI_DETECTOR_TELEDYNE_001: 0.4537
      LOCI_DETECTOR_JAI_001: 0.347
    pixel_size_z_um: null
  - id: LOCI_OBJECTIVE_OLYMPUS_20X_POL_001
    pixel_size_xy_um:
      LOCI_DETECTOR_TELEDYNE_001: 0.2271
      LOCI_DETECTOR_JAI_001: 0.1732
    pixel_size_z_um: null
  - id: LOCI_OBJECTIVE_OLYMPUS_40X_POL_001
    pixel_size_xy_um:
      LOCI_DETECTOR_TELEDYNE_001: 0.1142
      LOCI_DETECTOR_JAI_001: 0.0871
    pixel_size_z_um: null
  detectors:
  - LOCI_DETECTOR_TELEDYNE_001
  - LOCI_DETECTOR_JAI_001
stage:
  stage_id: LOCI_STAGE_PRIOR_001
  # Retracted ("safe") Z autofocus approaches the sample from; declaring it also declares the
  # approach direction. Per-insert overrides (inserts.configurations.<id>.safe_z_um, or
  # .safe_z_um_by_modality.<modality>) win over this scope-level fallback -- a dish and a slide
  # do not sit at the same height. Set them from Stage Map > Calibrate.
  #
  # PPM, measured 2026-08-26: increasing Z moves the stage DOWN, away from the objective, so
  # retract_sign is positive and ~0 is retracted (samples focus near -250). An earlier -500 was
  # WRONG-SIDE, inferred from "focus is near -400, so retract further" without establishing the
  # sign; measure it, never derive it.
  focus:
    retract_sign: positive
  safe_z_um: 0
  limits:
    x_um:
      low: -56723 #-36000
      high: 51571 #35500
    y_um:
      low: -50072 #-39000
      high: 25826 #34000
    z_um:
      low: -720
      high: 1000
  # XY motion profile: the values the Prior XYStage is held at all session.
  #
  # The adapter comes up at MaxSpeed=100 and Acceleration=100 -- each its own
  # maximum -- and the one thing a multi-slide run does that a single-slide run
  # never does is a 28-85 mm slot-to-slot traverse at that full rate. Capping
  # both is cheap: per-tile steps are ~300 um and dominated by settling, not
  # slew, so only the rare long traverse gets slower (sub-second either way).
  #
  # Holding them BELOW the controller's own defaults is also the only cheap
  # detector we have. A ProScan III has no absolute reference and nothing to
  # home to, so a controller that restarts resumes with position 0,0 wherever
  # it is standing -- it then goes exactly where commanded and reports exactly
  # that, which is why no arrival check can see it. But a restart also restores
  # ITS defaults, so a readback of 100 is evidence the frame moved. See
  # microscope_control/hardware/xy_motion.py.
  #
  # 50/50 is a starting point chosen to be clearly below the default, not a
  # measured optimum -- tune it against the 4-slide run that motivated it
  # (2026-10-02, MH_FNA: slot 1 correct, slots 2-4 progressively offset in Y).
  # Do NOT add SCurve here without first establishing which direction smooths
  # the motion on this controller; MaxSpeed and Acceleration are 1-100 percent
  # scales where lower is unambiguously gentler, and SCurve is not.
  xy_motion:
    properties:
      MaxSpeed: '50'
      Acceleration: '50'
    # Long moves only: a readback per tile step would add a serial round trip
    # for information that the next long move reports anyway.
    verify_after_move_um: 5000
    # A Prior step is 1 um and positions are reported in whole steps, so single
    # microns are granularity. 100 um is a third of a 20x field.
    drift_tolerance_um: 100
  inserts:
    slide_margin_um: 2000
    default: single_h
    configurations:
      single_h:
        name: Single Slide (Horizontal)
        description: Standard single slide holder with horizontal orientation
        aperture_left_x_um: 31508
        aperture_right_x_um: -35085
        aperture_top_y_um: 12588
        aperture_bottom_y_um: -48114
        slide_left_x_um: 31506
        slide_right_x_um: -43908
        slide_top_y_um: 12393
        slide_bottom_y_um: -12975
        aperture_height_mm: 60.0
        slide_width_mm: 75
        slide_height_mm: 25
      single_v:
        name: Single Slide (Vertical)
        description: Standard single slide holder with vertical orientation
        aperture_left_x_um: 0
        aperture_right_x_um: 60000
        slide_top_y_um: 0
        slide_bottom_y_um: 75000
        aperture_height_mm: 55.0
        slide_width_mm: 25
        slide_height_mm: 75
      quad_v:
        name: Four Slides (Vertical)
        description: Four slides arranged vertically
        kind: slide_holder
        # Two calibration modes (Stage Map -> Calibrate...):
        #  - Fixed pitch (default): capture the aperture edges below; the 4 slots
        #    are laid out at num_slides / slide_spacing_mm.
        #  - Per-slot (overrides pitch): capture each slot's center, written as
        #    slide1_center_x_um/_y_um ... slide4_center_x_um/_y_um. When present,
        #    these take precedence over the fixed pitch. Use per-slot when the
        #    holder's slide placement is not trusted to match a fixed pitch.
        # The aperture values below are placeholders -- recapture on the scope.
        aperture_left_x_um: 47796
        aperture_right_x_um: -60207
        slide_top_y_um: 32441
        slide_bottom_y_um: -40207
        aperture_height_mm: 55.0
        slide_width_mm: 25
        slide_height_mm: 75
        slide_spacing_mm: 30.0
        num_slides: 4
        slide1_center_x_um: 35661
        slide1_center_y_um: -3883
        slide2_center_x_um: 7520.5
        slide2_center_y_um: -3883
        slide3_center_x_um: -20416.5
        slide3_center_y_um: -3883
        slide4_center_x_um: -48255
        slide4_center_y_um: -3883
  streaming_af:
    enabled: true
    speed_property: MaxSpeed
    slow_speed_value: '1'
    # 2026-05-06: corrected from 1.422 (a flaky early PRBSAFZ probe).
    # Z-poll trace measured ~10.5 um/s actual on the PPM ZStage at
    # MaxSpeed=1, matching the pre-YAML hardcoded MIN_VELOCITY_UM_S=11.5
    # from streaming_focus.py (commit 7c59d2b). The bad 1.422 made
    # motion_duration_ms = 14000 instead of ~1700, so the scan loop
    # waited 14 s while the stage actually finished in <2 s -- the
    # remaining 12 s captured stationary frames mis-labelled across
    # the full scan range, parking the metric peak at the wrong end.
    slow_speed_um_per_s: 11.5
    normal_speed_value: '100'
slide_size_um:
  x: 40000
  y: 20000
light_path:
  optical_flip: xy
